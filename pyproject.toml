[project]
name = "canebiere"
version = "0.2.0"
description = "Des statistiques inutiles sur La Canebière Académie (horsjeu.net)"
authors = [{ name = "Julien Rossi", email = "mr.julien.rossi@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "altair>=5.5",
    "babel>=2.17",
    "beautifulsoup4>=4.13",
    "fr-core-news-sm",
    "frenchleffflemmatizer",
    "ipykernel>=6.29",
    "lxml>=6.0",
    "nbconvert>=7.16",
    "numpy>=2.3",
    "pandas>=2.3",
    "papermill>=2.6",
    "scrapy>=2.13",
    "spacy>=3.8",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dashboard = [
    "flask>=3.1",
    "python-dotenv>=1.1",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4",
    "nbstripout>=0.8",
    "ruff>=0.12",
]

[tool.uv]
package = true

[tool.uv.sources]
fr-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl" }
frenchleffflemmatizer = { git = "https://github.com/ClaudeCoulombe/FrenchLefffLemmatizer.git" }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "scraper/canebiere"]
